name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate_front_matter:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check blog front matter titles
        shell: bash
        run: |
          set -euo pipefail

          git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA" -- src/content/posts/ |
          while IFS= read -r file; do
            case "$file" in
              *.md|*.mdx)
                if ! yq --front-matter=extract -e 'has("title")' "$file" >/dev/null; then
                  printf '::error::Missing title field in front matter: %s\n' "$file"
                  exit 1
                fi
                ;;
            esac
          done

  build:
    needs: validate_front_matter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
